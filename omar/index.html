<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Omar Gym">
<meta name="theme-color" content="#0C1412">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Omar Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone app; sticky header with language switch; fixed timer + tab bar; sheet overlay for the exercise picker */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#F3F6F4; --ink:#121A17; --muted:#5A6661; --line:#D5DDD9; --chip:#E1E8E4;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --good:#1D8A58; --warn:#B7791F; --body:#DCE3DF; --region:#C5D0CA;
  --p25:#C8102E; --p20:#1F4FB3; --p15:#E8B90E; --p10:#1E8C4A; --p5:#F7F7F7; --p25k:#2B2F38; --p125:#B8BEC8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --track:.08em; --lh-display:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1412; --surface:#151F1C; --sunk:#101916; --ink:#E6EEEA; --muted:#8C9C95; --line:#24312C; --chip:#1E2A26;
  --accent:#3DD6B0; --accent-ink:#06150F; --good:#3CC88A; --warn:#E6B04A; --body:#26322E; --region:#3A4943; --p5:#E9EAEE; --p25k:#0A0C10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1412; --surface:#151F1C; --sunk:#101916; --ink:#E6EEEA; --muted:#8C9C95; --line:#24312C; --chip:#1E2A26;
  --accent:#3DD6B0; --accent-ink:#06150F; --good:#3CC88A; --warn:#E6B04A; --body:#26322E; --region:#3A4943; --p5:#E9EAEE; --p25k:#0A0C10; color-scheme:dark}
[dir="rtl"]{--display:"Cairo",system-ui,sans-serif; --text:"Cairo",system-ui,sans-serif; --track:0; --lh-display:1.3}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:var(--lh-display)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:var(--track);color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:var(--track);text-transform:uppercase}
.brand span{color:var(--accent)}
.lang{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.hero{padding-block:6px 14px;display:grid;gap:10px}
.hero h1{font-size:40px;font-weight:700;text-transform:uppercase}
.hero .sub{font-family:var(--display);font-size:21px;font-weight:500;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.rule{background:transparent;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.card h2{font-size:24px;font-weight:700;text-transform:uppercase}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:600;font-size:16px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip)}
.btn.small{padding:10px 12px;font-size:14px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0;justify-self:start}

/* exercise during training */
.ex{background:var(--surface);border-radius:16px;padding:14px 14px 10px;border:1px solid var(--line)}
.exhead{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.idx{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--muted);min-width:22px}
.exhead h3{font-size:22px;font-weight:600;text-transform:uppercase}
.grp{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:var(--track);color:var(--muted);margin-bottom:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.target{margin-top:3px;font-size:14px;color:var(--muted)}
.target b{color:var(--ink);font-weight:600}
.plates{display:flex;align-items:center;gap:3px;margin-top:8px;flex-wrap:wrap;direction:ltr;justify-content:flex-start}
.plates .lbl,.plates .txt{font-size:12px;color:var(--muted)}
.pl{width:9px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.pl.w25{height:30px;background:var(--p25)}.pl.w20{height:30px;background:var(--p20)}.pl.w15{height:26px;background:var(--p15)}
.pl.w10{height:22px;background:var(--p10)}.pl.w5{height:18px;background:var(--p5)}.pl.w2{height:15px;background:var(--p25k)}.pl.w1{height:12px;background:var(--p125)}
.sets{margin-top:10px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:62px 1fr 1fr 46px;gap:8px;align-items:center}
.set .lab{font-size:12px;color:var(--muted);font-weight:600}
.set .lab small{display:block;font-size:12px;color:var(--ink)}
.set.warm .lab{color:var(--warn)}
.field{display:flex;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 8px;min-width:0;gap:4px}
.field input,.field select{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 18px var(--display);padding:7px 0;font-variant-numeric:tabular-nums;unicode-bidi:plaintext}
.field span{font-size:12px;color:var(--muted);white-space:nowrap}
.set.warm .field,.field.locked{background:transparent;border-style:dashed}
.lk{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.chk{width:46px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.chk svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.5}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.chk[aria-pressed="true"] svg{stroke:#fff}
.set.done .field{opacity:.6}
details.ex.done{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-color:color-mix(in srgb,var(--good) 45%,var(--line));padding:10px 12px}
details.ex.done summary{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;cursor:pointer}
details.ex.done summary::-webkit-details-marker{display:none}
.okc{width:28px;height:28px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.okc svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3}
.dn{display:grid;min-width:0}.dt{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;line-height:1.15}
.ds{font-size:12px;color:var(--muted);overflow-wrap:anywhere;direction:ltr;text-align:start}
[dir="rtl"] .ds{text-align:end}
.result{margin:0;padding-inline-start:18px}.result li{margin-block:4px}
.up{color:var(--good);font-weight:600}.down{color:var(--warn);font-weight:600}

/* plan */
.week{display:grid;gap:8px}
.wday{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;width:100%}
.wday.rest{background:transparent;border-style:dashed}
.wday.today{border-color:var(--accent);border-width:2px}
.wday .d{font-family:var(--display);font-weight:700;font-size:20px;min-width:44px;text-transform:uppercase}
.wday h3{font-size:18px;font-weight:600}
.wday .s{font-size:13px;color:var(--muted)}
.wday .go{color:var(--muted);font-size:20px}
[dir="rtl"] .wday .go{transform:scaleX(-1)}
.it{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.ithead{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.ithead b{font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;display:block;line-height:1.15}
.ibtns{display:flex;gap:4px}
.ibtns button{border:0;background:var(--chip);border-radius:8px;width:34px;height:32px;font-size:15px;font-weight:700}
.itgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.itgrid label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.step{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:transparent;height:38px;font-size:18px;font-weight:700}
.step output{text-align:center;font:600 18px var(--display)}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center}
.backrow{display:flex;align-items:center;gap:8px}
.backrow button{border:0;background:var(--chip);border-radius:10px;padding:8px 12px;font-weight:600}
input.txt{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.confirm{background:var(--warn)!important;color:#fff!important}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheethead h2{font-size:26px;text-transform:uppercase}
.bodybox{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.bodybox svg{width:150px;height:auto;max-width:100%}
.rg{cursor:pointer}
.rg *{fill:var(--f,var(--region));stroke:var(--bg);stroke-width:1.5;transition:fill .15s}
.rg[aria-pressed="true"] *{fill:var(--accent)}
.bd *{fill:var(--body)}
.deco{stroke:var(--bg);stroke-width:1.5;fill:none;pointer-events:none}
.exl{display:grid;gap:6px}
.exr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start;width:100%}
.exr b{font-weight:600;display:block}
.exr small{color:var(--muted);font-size:12px}
.exr .plus{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;font-weight:700}
.exr.added .plus{background:var(--good)}

/* muscles */
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:10px;align-items:center;font-size:14px}
.vbar{position:relative;height:10px;border-radius:6px;background:var(--chip);overflow:hidden}
.vbar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px}
.vbar .zone{position:absolute;inset-block:0;inset-inline-start:40%;width:40%;background:color-mix(in srgb,var(--good) 16%,transparent)}
.lo i{background:var(--warn)}.ok i{background:var(--good)}.hi i{background:var(--accent)}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px;justify-items:center}
.bodies svg{width:100%;max-width:170px;height:auto}
.bodies .cap{font-size:12px;color:var(--muted);text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.hist{display:grid;gap:0;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-block:7px}
.wrow{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;font-size:14px}
.backup textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:12px ui-monospace,Menlo,monospace;padding:8px;direction:ltr}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.faq{display:grid}
.faq details{border-bottom:1px solid var(--line);padding-block:10px}
.faq details:last-child{border-bottom:0}
.faq summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-weight:700}
.faq details[open] summary::after{content:"−"}
.faq p{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:65ch}
.tips{margin:0;padding-inline-start:18px;display:grid;gap:6px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.timer{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding-top:10px}
.timer .t{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.timer .l{font-size:12px;color:var(--muted)}
.timer.over .t{color:var(--good)}
.timer button{border:0;background:var(--chip);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;padding:12px 0 10px;font-size:13px;font-weight:600;color:var(--muted);border-top:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}
.sync{font-size:12px;color:var(--muted);text-align:center;padding-block:14px 0}
@media (max-width:380px){.bodybox{grid-template-columns:120px 1fr}.bodybox svg{width:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="brand">Omar <span>Gym</span></div>
    <div class="lang" role="group" aria-label="Sprache / اللغة">
      <button type="button" data-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-lang="ar" aria-pressed="false">عربي</button>
    </div>
  </header>
  <main id="view"></main>
  <p class="sync"><span id="sync"></span> · v5</p>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="dock">
  <div class="timer" id="timer" hidden>
    <div><div class="t" id="tT">0:00</div><div class="l" id="tL"></div></div>
    <button id="tPlus" type="button" dir="ltr">+30 s</button>
    <button id="tStop" type="button"></button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div>

<script>

function newItem(k){

  S.plan=plan; S.weights={}; S.fails={}; S.lastReps={}; save();
}
const dayOf=d=>S.plan&&S.plan[d]?S.plan[d]:{name:"",items:[]};

function daySub(d){

  return ms.slice(0,4).join(" · ");
}

/* ================= Training heute ================= */
function buildPlan(day, ready){
  let firstHeavy=true;
  return dayOf(day).items.map((it,i)=>{
    const e=ex(it.ex);
    let w=S.weights[it.id]; if(w==null && e.eq==="bw") w=0;
    let sets=it.sets;
    const step=it.inc||2.5;
    if(ready==="low"){ if(w) w=roundTo(w*0.9,step); if(sets>=3) sets--; }
    let warm=[];
    if(e.c && w && w>0){
      if(firstHeavy && e.eq==="bb" && w>=40){ warm=[[20,10],[.5,5],[.7,3]].map(([p,r])=>({w:p===20?20:Math.max(20,roundTo(w*p,2.5)),r})); if(it.lo<=6) warm.push({w:roundTo(w*.85,2.5),r:1}); }
      else if(firstHeavy) warm=[{w:roundTo(w*.5,step),r:8},{w:roundTo(w*.75,step),r:4}];
      else warm=[{w:roundTo(w*.6,step),r:6}];
      firstHeavy=false;
    }
    return {...it,i,e,w,sets,warm};
  });
}
const setKey=(p,j)=>p.id+"|"+j;
function getSession(ds,create){
  if(!S.sessions[ds]&&create) S.sessions[ds]={day:parse(ds).getDay(),ready:"normal",sets:{},warm:{},done:false,result:null,unlock:{}};
  return S.sessions[ds];
}

function plateHTML(w){
  if(!w||w<20) return "";

  const cls={25:"w25",20:"w20",15:"w15",10:"w10",5:"w5",2.5:"w2",1.25:"w1"};
  return `<div class="plates"><span class="lbl">${t("per_side_plates")}</span>${out.map(x=>`<i class="pl ${cls[x]}"></i>`).join("")}<span class="txt num">${out.length?out.map(x=>kg(x)).join(" + "):t("only_bar")} ${t("kg")}</span></div>`;
}

  const todo=[],doneC=[];

    let exDone=true; for(let j=0;j<p.sets;j++) if(!sess.sets[setKey(p,j)]?.done) exDone=false;

    } else {
      const wTxt=p.w==null?`<b>${t("start_w")}</b>`:(p.w===0?`<b>${t("bw")}</b>`:`<b class="num">${kg(p.w)} ${unit}</b>`);
      h+=`<article class="ex"><div class="exhead"><div class="idx num">${n+1}</div><div>
        <div class="grp"><span class="dot"></span>${musName(p.e.m)}</div><h3>${esc(exName(p.ex))}</h3>
        <div class="target num"><b><bdi dir="ltr">${p.sets} × ${p.lo}–${p.hi}</bdi></b>${p.e.side?" "+t("per_side"):""} · ${wTxt} · ${t("rest")} ${mmss(p.rest)}</div>
        <div class="meta" style="margin-top:6px"><span class="pill rule">${t("rule")}</span></div>
        ${p.e.eq==="bb"&&p.w?plateHTML(p.w):""}</div></div><div class="sets">`;
      p.warm.forEach((wu,j)=>{const k=p.id+"|w"+j,d=!!sess.warm[k];
        h+=`<div class="set warm ${d?"done":""}"><span class="lab">${t("warm")}</span>
         <div class="field"><input value="${kg(wu.w)}" readonly tabindex="-1" aria-label="${t("weight")}"><span>${t("kg")}</span></div>

         <button type="button" class="chk" data-warm="${k}" aria-pressed="${d}" aria-label="${t("warm")}">${CHECK}</button></div>`});
    }
    for(let j=0;j<p.sets;j++){
      const k=setKey(p,j),st=sess.sets[k]||{};
      const last=(S.lastReps[p.id]||[])[j];
      const tgt=Math.min(p.hi,last!=null?last+1:p.lo);
      const defR=st.r??tgt;
      const defW=lockW?p.w:(st.w??(p.w??""));
      h+=`<div class="set ${st.done?"done":""}"><span class="lab">${t("set")} ${j+1}<small class="num">${t("target")} ${tgt}</small></span>
        <div class="field ${lockW?"locked":""}"><input id="w-${k}" inputmode="decimal" data-w="${k}" value="${defW===""?"":kg(defW)}" placeholder="${p.w==null?t("start"):t("kg")}" aria-label="${t("weight")}" ${lockW?"readonly":""}><span>${lockW?LOCK:t("kg")}</span></div>
        <div class="field"><input id="r-${k}" inputmode="numeric" data-r="${k}" value="${defR}" aria-label="${t("reps")}"><span>${t("reps")}</span></div>
        <button type="button" class="chk" data-set="${k}" data-rest="${p.rest}" data-name="${esc(exName(p.ex))}" aria-pressed="${!!st.done}" aria-label="${t("set")} ${j+1}">${CHECK}</button></div>`;
    }
    if(lockW&&!exDone) h+=`<button type="button" class="linkbtn" data-unlock="${p.id}">${t("unlock")}</button>`;
    h+=exDone?`</div></details>`:`</div></article>`;
    (exDone?doneC:todo).push(h);

  else html+=`<button class="btn primary" type="button" id="finish">${t("finish")}</button><p class="hint">${t("finish_hint")}</p>`;
  return html+`</div>`;

function finish(){
  const ds=todayIso(),sess=getSession(ds,false); if(!sess) return;
  const plan=buildPlan(sess.day,sess.ready); const adjusted=sess.ready==="low"; const res=[]; let vol=0,setsN=0;
  plan.forEach(p=>{
    const logged=[]; for(let j=0;j<p.sets;j++){const st=sess.sets[setKey(p,j)]; if(st&&st.done){logged.push({w:num(st.w),r:num(st.r)}); setsN++; vol+=(num(st.w)||0)*(num(st.r)||0)*(p.e.side?2:1);}}
    if(!logged.length) return;
    const name=`<b>${esc(exName(p.ex))}:</b> `;
    if(adjusted){res.push(name+t("r_adj"));return}
    const ws=logged.map(x=>x.w).filter(x=>x!=null);
    const base=ws.length?Math.min(...ws):(p.e.eq==="bw"?0:null);
    if(base==null) return;
    const prev=S.weights[p.id]; S.weights[p.id]=base;
    let f=S.fails[p.id]||0,msg; const inc=p.inc||2.5;
    if(logged.length>=p.sets && logged.every(x=>x.r!=null&&x.r>=p.hi)){S.weights[p.id]=base+inc;f=0;S.lastReps[p.id]=[];msg=`<span class="up">${t("r_up",{x:kg(inc),w:kg(base+inc)})}</span>`}
    else if(logged.some(x=>x.r!=null&&x.r<p.lo)){f++; if(f>=2){S.weights[p.id]=Math.max(0,base-inc);f=0;S.lastReps[p.id]=[];msg=`<span class="down">${t("r_down",{w:kg(S.weights[p.id])})}</span>`} else {S.lastReps[p.id]=logged.map(x=>x.r);msg=t("r_reps",{w:kg(base)})}}
    else {S.lastReps[p.id]=(prev!=null&&prev!==base)?[]:logged.map(x=>x.r);msg=t("r_stay",{w:kg(base),hi:p.hi})}
    S.fails[p.id]=f; if(prev==null) msg+=" "+t("r_start");
    res.push(name+msg);
  });
  S.history=S.history.filter(h=>h.date!==ds);
  S.history.push({date:ds,day:sess.day,name:dayTitle(sess.day),sets:setsN,vol:Math.round(vol)});
  sess.done=true; sess.result=res.length?res:[t("r_saved")]; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}

function weeklyVolume(){
  const v={}; MUS_ORDER.forEach(m=>v[m]=0);
  if(!S.plan) return v;
  ORDER.forEach(d=>dayOf(d).items.forEach(it=>{const e=ex(it.ex); v[e.m]=(v[e.m]||0)+it.sets; (e.sec||[]).forEach(m=>v[m]=(v[m]||0)+it.sets/2);}));
  return v;
}
function heat(n){ if(!n) return ""; if(n<10) return "color-mix(in srgb, var(--warn) 70%, var(--region))"; if(n<=20) return "color-mix(in srgb, var(--good) 85%, var(--region))"; return "var(--accent)"; }
function viewMuscles(){

/* ================= Timer ================= */
let tEnd=0,tLabel="",tInt=null,tRang=false,actx=null,wake=null;
function unlockAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;const t0=actx.currentTime;[0,.35,.7].forEach(dt=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(.4,t0+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.25);o.start(t0+dt);o.stop(t0+dt+.3)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
async function keepAwake(){try{if(!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}catch(e){}}
function startTimer(sec,label){tEnd=Date.now()+sec*1000;tLabel=label;tRang=false;document.getElementById("timer").hidden=false;tick();clearInterval(tInt);tInt=setInterval(tick,250)}
function tick(){const left=(tEnd-Date.now())/1000;document.getElementById("tT").textContent=left>0?mmss(left):t("go");
  document.getElementById("tL").textContent=left>0?t("timer_rest")+" · "+tLabel:t("next_set")+": "+tLabel;
  document.getElementById("timer").classList.toggle("over",left<=0); if(left<=0&&!tRang){tRang=true;beep()} if(left<-60)stopTimer()}
function stopTimer(){clearInterval(tInt);document.getElementById("timer").hidden=true}
document.getElementById("tPlus").addEventListener("click",()=>{tEnd=Math.max(tEnd,Date.now())+30000;tRang=false;tick()});
document.getElementById("tStop").addEventListener("click",stopTimer);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){wake=null;if(!document.getElementById("timer").hidden)keepAwake()}});

/* ================= Render + Events ================= */

function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
document.querySelector(".top").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;S.lang=b.dataset.lang;save();render()});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;editDay=null;tplArm=null;render();window.scrollTo(0,0)});

document.getElementById("view").addEventListener("click",e=>{
  unlockAudio();
  const b=e.target.closest("button"); if(!b) return; const ds=todayIso(); const d=b.dataset;
  if(d.lang){S.lang=d.lang;save();render();return}
  if(d.tpl){ if(S.plan && tplArm!==d.tpl){tplArm=d.tpl;keepScroll(render);return} tplArm=null; loadTemplate(d.tpl); tab="plan"; editDay=null; render(); window.scrollTo(0,0); return }
  if(d.go){tab=d.go;render();return}
  if(d.help){tab="more";render();const h=document.getElementById("help");h&&h.scrollIntoView();return}
  if(d.edit!=null){editDay=Number(d.edit);copyMsg=null;render();window.scrollTo(0,0);return}
  if(d.back){editDay=null;render();return}
  if(d.add!=null){picker={day:Number(d.add),side:"front",region:null,mus:null,q:""};renderSheet();return}
  if(d.copy!=null){const src=dayOf(editDay);S.plan[Number(d.copy)]={name:src.name,items:src.items.map(x=>({...x,id:uid()}))};save();copyMsg=t("copied")+": "+WDAY[S.lang][Number(d.copy)];keepScroll(render);return}
  if(d.act){const f=findItem(d.id);if(!f)return;const it=f.items[f.i];
    if(d.act==="up"&&f.i>0){f.items.splice(f.i-1,0,f.items.splice(f.i,1)[0])}
    if(d.act==="down"&&f.i<f.items.length-1){f.items.splice(f.i+1,0,f.items.splice(f.i,1)[0])}
    if(d.act==="del"){f.items.splice(f.i,1)}
    if(d.act==="sets+")it.sets=Math.min(10,it.sets+1);
    if(d.act==="sets-")it.sets=Math.max(1,it.sets-1);
    save();keepScroll(render);return}
  if(d.pick){const s=getSession(ds,true);s.day=Number(d.pick);s.sets={};s.warm={};s.done=false;s.result=null;save();render();return}
  if(d.ready){const s=getSession(ds,true);if(s.done)return;s.ready=d.ready;save();keepScroll(render);return}
  if(d.unlock){const s=getSession(ds,true);s.unlock=s.unlock||{};s.unlock[d.unlock]=true;save();keepScroll(render);return}
  if(d.warm){const s=getSession(ds,true);s.warm[d.warm]=!s.warm[d.warm];save();keepScroll(render);if(s.warm[d.warm])startTimer(60,t("warmup"));return}
  if(d.set){const s=getSession(ds,true);const k=d.set;const wIn=document.getElementById("w-"+k),rIn=document.getElementById("r-"+k);
    const st=s.sets[k]||{};st.w=num(wIn&&wIn.value);st.r=num(rIn&&rIn.value);st.done=!st.done;s.sets[k]=st;
    const p=k.split("|")[0]; const it=findItem(p); const bw=it&&ex(it.items[it.i].ex).eq==="bw";
    if(st.done&&st.w==null&&!bw){st.done=false;wIn&&wIn.focus();return}
    if(st.w==null&&bw)st.w=0;
    save();keepScroll(render);if(st.done){keepAwake();startTimer(Number(d.rest),d.name)}return}
  if(b.id==="finish"){finish();return}
  if(b.id==="bkCopy"){const tx=JSON.stringify(S);const ta=document.getElementById("bk");ta.value=tx;const m=document.getElementById("bkMsg");
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(()=>m.textContent=t("b_copied")).catch(()=>{ta.select();m.textContent=t("b_sel")});else{ta.select();m.textContent=t("b_sel")}return}
  if(b.id==="bkLoad"){const m=document.getElementById("bkMsg");try{const x=JSON.parse(document.getElementById("bk").value);if(x&&x.v===1){S=Object.assign(DEFAULT(),x);save();render()}else throw 0}catch(err){m.textContent=t("b_bad")}return}
});
document.getElementById("view").addEventListener("change",e=>{

  if(d.w||d.r){const s=getSession(ds,true);const k=d.w||d.r;const st=s.sets[k]||{};if(d.w)st.w=num(el.value);else st.r=num(el.value);s.sets[k]=st;save()}
  if(d.dname!=null){S.plan[Number(d.dname)]=dayOf(Number(d.dname));S.plan[Number(d.dname)].name=el.value.trim();save()}
  if(d.f){const f=findItem(d.id);if(!f)return;const it=f.items[f.i];

    if(d.f==="hi"){const v=num(el.value);if(v)it.hi=Math.max(Math.round(v),it.lo)}

    save();keepScroll(render)}
  if(d.wk){const v=num(el.value);if(v==null)delete S.weights[d.wk];else S.weights[d.wk]=v;save()}
});
const sheet=document.getElementById("sheet");
sheet.addEventListener("click",e=>{
  const r=e.target.closest(".rg[data-r]");
  if(r&&r.dataset.r){picker.region=picker.region===r.dataset.r?null:r.dataset.r;picker.mus=null;renderSheet();return}
  const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  if(d.close){picker=null;renderSheet();render();return}
  if(d.side){picker.side=d.side;picker.region=null;picker.mus=null;renderSheet();return}
  if(d.mus!=null){picker.mus=d.mus||null;renderSheet();return}
  if(d.addex){addExercise(d.addex);return}
  if(b.id==="cadd"){const n=document.getElementById("cname").value.trim();if(!n){document.getElementById("cname").focus();return}
    const k="c_"+uid();S.custom[k]={k,m:document.getElementById("cmus").value,eq:"m",c:false,de:n,ar:n,sec:[]};addExercise(k);return}
});
sheet.addEventListener("keydown",e=>{const r=e.target.closest&&e.target.closest(".rg[data-r]");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();r.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
sheet.addEventListener("input",e=>{if(e.target.id==="psearch"){picker.q=e.target.value;const pos=e.target.selectionStart;renderSheet();const s=document.getElementById("psearch");s.focus();try{s.setSelectionRange(pos,pos)}catch(err){}}});

/* ================= Start ================= */
(function boot(){
  const l=lsGet(); if(l&&l.v===1) S=Object.assign(DEFAULT(),l);
  render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator){
    let reloaded=false; const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hadController&&!reloaded){ reloaded=true; location.reload(); } });
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{ try{r.update()}catch(e){} }).catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}); });
  }
  let last=todayIso(); setInterval(()=>{const n=todayIso();if(n!==last){last=n;if(tab==="today")render()}},60000);
})();
</script>
